name: HACS Validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 주 1회 (월요일 04:00 UTC) — HACS 가 검증 규칙을 바꿨을 때를 감지한다.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # `brands` 검사는 도메인이 home-assistant/brands 저장소에 등록되어 있어야 통과한다.
          # 이 통합은 HACS 기본 스토어 등재를 전제하지 않는 커스텀 저장소이므로 제외한다.
          ignore: brands
